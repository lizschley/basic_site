<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Container styles */
        .carousel-container {
            max-width: 800px;
            margin: 2rem auto;
            border: 2px solid #333;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Scale-down approach */
        .scale-carousel img {
            width: 100%;
            height: 650px;
            object-fit: scale-down;
            border-radius: 4px;
            background-color: #f7f3db;
        }

        /* Common styles */
        .carousel-inner {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <h3>scale-carousel</h3>
        <div id="carouselCover" class="carousel slide scale-carousel" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://lizschley-static.s3.us-east-1.amazonaws.com/basic_website/travel/hawaii/airplane_daytime.png" alt="vertical Image">
                </div>	
                <div class="carousel-item">
                    <img src="https://lizschley-static.s3.us-east-1.amazonaws.com/basic_website/travel/hawaii/airplane_sunrise.png" alt="Horizontal Image">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/800/400?random=1" alt="Horizontal Image">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/400/800?random=2" alt="Vertical Image">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/1200/300?random=3" alt="Wide Image">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselCover" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselCover" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>
    </div>

    <div class="carousel-container mt-4">
        <h3>Contain Approach (Shows Full Image)</h3>
        <div id="carouselContain" class="carousel slide contain-carousel" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/800/400?random=4" alt="Horizontal Image">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/400/800?random=5" alt="Vertical Image">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/1200/300?random=6" alt="Wide Image">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselContain" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselContain" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
